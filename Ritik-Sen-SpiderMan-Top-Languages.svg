<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 282" width="420" height="282" role="img" aria-label="Ritik Sen top languages">
<defs>
<style><![CDATA[
text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes shineX{0%{transform:translateX(-140px)}60%,100%{transform:translateX(460px)}}
.row{opacity:0;animation:fadeUp .5s ease forwards}
.sh{animation:shineX 4s ease-in-out 2.2s infinite}
]]></style>

<linearGradient id="spider" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#ef233c"/>
  <stop offset="50%" stop-color="#ff4d5a"/>
  <stop offset="100%" stop-color="#ef233c"/>
</linearGradient>

<linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#38bdf8"/>
  <stop offset="100%" stop-color="#2563eb"/>
</linearGradient>

<linearGradient id="shg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
  <stop offset="50%" stop-color="#fff" stop-opacity=".08"/>
  <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
</linearGradient>

<clipPath id="cardc"><rect x="1" y="1" width="418" height="280" rx="14"/></clipPath>
<clipPath id="stackc">
  <rect x="20" y="58" width="0" height="11" rx="5.5">
    <animate attributeName="width" from="0" to="380" dur="1.4s" begin=".4s" fill="freeze"/>
  </rect>
</clipPath>
</defs>

<!-- Spider-Man card -->
<rect x="1" y="1" width="418" height="280" rx="14" fill="#090d16" stroke="url(#spider)" stroke-width="1.7"/>

<!-- subtle web background -->
<g opacity=".12" fill="none" stroke="#38bdf8" stroke-width=".7">
  <path d="M320 1 Q370 40 320 80 T320 160 T320 240 T320 282"/>
  <path d="M365 1 Q415 40 365 80 T365 160 T365 240 T365 282"/>
  <path d="M410 1 Q460 40 410 80 T410 160 T410 240 T410 282"/>
  <path d="M300 55 Q355 78 420 55"/>
  <path d="M300 100 Q355 123 420 100"/>
  <path d="M300 145 Q355 168 420 145"/>
  <path d="M300 190 Q355 213 420 190"/>
  <path d="M300 235 Q355 258 420 235"/>
</g>

<text x="20" y="34" font-size="16" font-weight="bold" fill="url(#spider)">🕷️ Top Languages</text>

<!-- stack: Python 45%, HTML 25%, CSS 15%, SQL 15% -->
<g clip-path="url(#stackc)">
  <rect x="20" y="58" width="171" height="11" fill="#3776AB"/>
  <rect x="191" y="58" width="95" height="11" fill="#E34F26"/>
  <rect x="286" y="58" width="57" height="11" fill="#1572B6"/>
  <rect x="343" y="58" width="57" height="11" fill="#38bdf8"/>
</g>

<g class="row" style="animation-delay:.90s">
  <circle cx="26" cy="91" r="5" fill="#3776AB"/>
  <text x="40" y="96" font-size="13" fill="#e6edf3" font-weight="bold">Python</text>
  <text x="396" y="96" text-anchor="end" font-size="13" fill="#60a5fa" font-weight="bold">45.0%</text>
  <rect x="40" y="104" width="268" height="9" rx="4.5" fill="#182536"/>
  <rect x="40" y="104" width="120.6" height="9" rx="4.5" fill="#3776AB">
    <animate attributeName="width" from="0" to="120.6" dur="1.1s" begin="1.05s" fill="freeze"/>
  </rect>
</g>

<g class="row" style="animation-delay:1.25s">
  <circle cx="26" cy="133" r="5" fill="#E34F26"/>
  <text x="40" y="138" font-size="13" fill="#e6edf3" font-weight="bold">HTML</text>
  <text x="396" y="138" text-anchor="end" font-size="13" fill="#ff704d" font-weight="bold">25.0%</text>
  <rect x="40" y="146" width="268" height="9" rx="4.5" fill="#182536"/>
  <rect x="40" y="146" width="67" height="9" rx="4.5" fill="#E34F26">
    <animate attributeName="width" from="0" to="67" dur="1.1s" begin="1.40s" fill="freeze"/>
  </rect>
</g>

<g class="row" style="animation-delay:1.60s">
  <circle cx="26" cy="175" r="5" fill="#1572B6"/>
  <text x="40" y="180" font-size="13" fill="#e6edf3" font-weight="bold">CSS</text>
  <text x="396" y="180" text-anchor="end" font-size="13" fill="#38bdf8" font-weight="bold">15.0%</text>
  <rect x="40" y="188" width="268" height="9" rx="4.5" fill="#182536"/>
  <rect x="40" y="188" width="40.2" height="9" rx="4.5" fill="#1572B6">
    <animate attributeName="width" from="0" to="40.2" dur="1.1s" begin="1.75s" fill="freeze"/>
  </rect>
</g>

<g class="row" style="animation-delay:1.95s">
  <circle cx="26" cy="217" r="5" fill="#38bdf8"/>
  <text x="40" y="222" font-size="13" fill="#e6edf3" font-weight="bold">SQL</text>
  <text x="396" y="222" text-anchor="end" font-size="13" fill="#38bdf8" font-weight="bold">15.0%</text>
  <rect x="40" y="230" width="268" height="9" rx="4.5" fill="#182536"/>
  <rect x="40" y="230" width="40.2" height="9" rx="4.5" fill="#38bdf8">
    <animate attributeName="width" from="0" to="40.2" dur="1.1s" begin="2.10s" fill="freeze"/>
  </rect>
</g>

<g clip-path="url(#cardc)">
  <rect class="sh" x="0" y="0" width="100" height="282" fill="url(#shg)" transform="skewX(-15)"/>
</g>
</svg>