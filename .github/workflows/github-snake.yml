name: Generate contribution snake 🕸️

on:
  schedule:
    - cron: "0 0 * * *"   # runs every day at midnight
  workflow_dispatch:       # lets you run it manually from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Ritiksen04
          outputs: |
            dist/github-snake-dark.svg?color_snake=#e23636&color_dots=#0d1117,#2a0a0a,#3f5ac4,#8ab4f8,#e23636
            dist/github-snake.svg?color_snake=#e23636&color_dots=#f0f0f0,#c9d1d9,#8ab4f8,#3f5ac4,#e23636

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
