<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1092 168" width="1092" height="168" role="img" aria-label="Ritik Sen Spider-Man GitHub trophies">
<defs>
<style><![CDATA[
text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes popCell{0%{opacity:0;transform:translateY(16px) scale(.85)}70%{opacity:1;transform:translateY(-3px) scale(1.03)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes rankGlow{0%,100%{opacity:.75}50%{opacity:1}}
@keyframes shineX2{0%{transform:translateX(-200px) skewX(-15deg)}60%,100%{transform:translateX(1172px) skewX(-15deg)}}
.cell{opacity:0;animation:popCell .55s cubic-bezier(.2,.8,.3,1.2) forwards;transform-box:fill-box;transform-origin:center}
.rk{animation:rankGlow 2.2s ease-in-out infinite}
.sh2{animation:shineX2 5s ease-in-out 2s infinite}
]]></style>

<linearGradient id="spiderRed" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#ef233c"/>
<stop offset="50%" stop-color="#ff4d5a"/>
<stop offset="100%" stop-color="#ef233c"/>
</linearGradient>

<linearGradient id="spiderBlue" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#38bdf8"/>
<stop offset="100%" stop-color="#2563eb"/>
</linearGradient>

<linearGradient id="ringg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#ef233c"/>
<stop offset="55%" stop-color="#ef233c"/>
<stop offset="100%" stop-color="#38bdf8"/>
</linearGradient>

<linearGradient id="shg2" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#fff" stop-opacity="0"/>
<stop offset="50%" stop-color="#fff" stop-opacity=".07"/>
<stop offset="100%" stop-color="#fff" stop-opacity="0"/>
</linearGradient>

<clipPath id="tc"><rect x="0" y="0" width="1092" height="168" rx="14"/></clipPath>
</defs>

<!-- Dark Spider-Man background -->
<rect x="1" y="1" width="1090" height="166" rx="14" fill="#090d16" stroke="url(#spiderRed)" stroke-width="1.7"/>

<!-- subtle Spider-Man web -->
<g opacity=".12" fill="none" stroke="#38bdf8" stroke-width=".75">
<path d="M0 84 Q80 25 170 84 T340 84 T510 84 T680 84 T850 84 T1020 84 T1190 84"/>
<path d="M0 125 Q80 66 170 125 T340 125 T510 125 T680 125 T850 125 T1020 125 T1190 125"/>
<path d="M170 0 Q230 42 170 84 T170 168"/>
<path d="M350 0 Q410 42 350 84 T350 168"/>
<path d="M530 0 Q590 42 530 84 T530 168"/>
<path d="M710 0 Q770 42 710 84 T710 168"/>
<path d="M890 0 Q950 42 890 84 T890 168"/>
</g>

<!-- Trophy 1 -->
<g class="cell" style="animation-delay:.30s">
<rect x="12" y="12" width="168" height="144" rx="14" fill="#0d1420" stroke="#ef233c" stroke-opacity=".65" stroke-width="1.3"/>
<text x="96" y="52" text-anchor="middle" font-size="30">🕷️</text>
<text class="rk" x="164" y="40" text-anchor="end" font-size="24" font-weight="bold" fill="#ef233c">SSS</text>
<text x="96" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6edf3">Spider Dev</text>
<text x="96" y="112" text-anchor="middle" font-size="11" fill="#9aa4b2">Web-Slinger x6</text>
<rect x="30" y="124" width="132" height="5" rx="2.5" fill="#182536"/>
<rect x="30" y="124" width="0" height="5" rx="2.5" fill="#ef233c"><animate attributeName="width" from="0" to="132" dur="1s" begin=".60s" fill="freeze"/></rect>
</g>

<!-- Trophy 2 -->
<g class="cell" style="animation-delay:.48s">
<rect x="192" y="12" width="168" height="144" rx="14" fill="#0d1420" stroke="#38bdf8" stroke-opacity=".65" stroke-width="1.3"/>
<text x="276" y="52" text-anchor="middle" font-size="30">🕸️</text>
<text class="rk" x="344" y="40" text-anchor="end" font-size="30" font-weight="bold" fill="#38bdf8">S</text>
<text x="276" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6edf3">Web-Slinger</text>
<text x="276" y="112" text-anchor="middle" font-size="11" fill="#9aa4b2">GitHub Badge</text>
<rect x="210" y="124" width="132" height="5" rx="2.5" fill="#182536"/>
<rect x="210" y="124" width="0" height="5" rx="2.5" fill="#38bdf8"><animate attributeName="width" from="0" to="132" dur="1s" begin=".78s" fill="freeze"/></rect>
</g>

<!-- Trophy 3 -->
<g class="cell" style="animation-delay:.66s">
<rect x="372" y="12" width="168" height="144" rx="14" fill="#0d1420" stroke="#facc15" stroke-opacity=".65" stroke-width="1.3"/>
<text x="456" y="52" text-anchor="middle" font-size="30">⭐</text>
<text class="rk" x="524" y="40" text-anchor="end" font-size="30" font-weight="bold" fill="#facc15">A</text>
<text x="456" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6edf3">Stargazer</text>
<text x="456" y="112" text-anchor="middle" font-size="11" fill="#9aa4b2">Stars 50+</text>
<rect x="390" y="124" width="132" height="5" rx="2.5" fill="#182536"/>
<rect x="390" y="124" width="0" height="5" rx="2.5" fill="#facc15"><animate attributeName="width" from="0" to="132" dur="1s" begin=".96s" fill="freeze"/></rect>
</g>

<!-- Trophy 4 -->
<g class="cell" style="animation-delay:.84s">
<rect x="552" y="12" width="168" height="144" rx="14" fill="#0d1420" stroke="#ef233c" stroke-opacity=".65" stroke-width="1.3"/>
<text x="636" y="52" text-anchor="middle" font-size="30">🕷️</text>
<text class="rk" x="704" y="40" text-anchor="end" font-size="30" font-weight="bold" fill="#ef233c">A</text>
<text x="636" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6edf3">Rising Hero</text>
<text x="636" y="112" text-anchor="middle" font-size="11" fill="#9aa4b2">Followers 25+</text>
<rect x="570" y="124" width="132" height="5" rx="2.5" fill="#182536"/>
<rect x="570" y="124" width="0" height="5" rx="2.5" fill="#ef233c"><animate attributeName="width" from="0" to="132" dur="1s" begin="1.14s" fill="freeze"/></rect>
</g>

<!-- Trophy 5 -->
<g class="cell" style="animation-delay:1.02s">
<rect x="732" y="12" width="168" height="144" rx="14" fill="#0d1420" stroke="#38bdf8" stroke-opacity=".65" stroke-width="1.3"/>
<text x="816" y="52" text-anchor="middle" font-size="30">💻</text>
<text class="rk" x="884" y="40" text-anchor="end" font-size="30" font-weight="bold" fill="#38bdf8">A</text>
<text x="816" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6edf3">Code Hero</text>
<text x="816" y="112" text-anchor="middle" font-size="11" fill="#9aa4b2">Commits 500+</text>
<rect x="750" y="124" width="132" height="5" rx="2.5" fill="#182536"/>
<rect x="750" y="124" width="0" height="5" rx="2.5" fill="#38bdf8"><animate attributeName="width" from="0" to="132" dur="1s" begin="1.32s" fill="freeze"/></rect>
</g>

<!-- Trophy 6 -->
<g class="cell" style="animation-delay:1.20s">
<rect x="912" y="12" width="168" height="144" rx="14" fill="#0d1420" stroke="#4ade80" stroke-opacity=".65" stroke-width="1.3"/>
<text x="996" y="52" text-anchor="middle" font-size="30">📦</text>
<text class="rk" x="1064" y="40" text-anchor="end" font-size="30" font-weight="bold" fill="#4ade80">B</text>
<text x="996" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#e6edf3">Creator</text>
<text x="996" y="112" text-anchor="middle" font-size="11" fill="#9aa4b2">Repos 8+</text>
<rect x="930" y="124" width="132" height="5" rx="2.5" fill="#182536"/>
<rect x="930" y="124" width="0" height="5" rx="2.5" fill="#4ade80"><animate attributeName="width" from="0" to="132" dur="1s" begin="1.50s" fill="freeze"/></rect>
</g>

<g clip-path="url(#tc)">
<rect class="sh2" x="0" y="0" width="140" height="168" fill="url(#shg2)"/>
</g>
</svg>